#:schema /config/flashing_tool_schema.json
# This is what gets used in the "flasher" setting in a board configuration

# This is where the tool is located, leave blank to assume the tool is in the PATH
tool_name = ""
tool_loc = ""

[tool_settings]
# Can be CLI or PYTHON
type = "cli"
# The supported board types. See board_type.py for available options
supported_boards = ["ARDUINO", "ESPIDF"]
# Supported file types
supported_file_types = ["*.hex", "*.bin"]

# CLI tools only. Set to true if the tool writes progress/status via Win32
# console APIs (colored text, cursor-positioned progress bars) rather than
# plain stdout -- those calls produce no captured output at all over a
# plain pipe, so the tool needs a real pseudo console (ConPTY) attached.
# Leave false/omitted for tools that just print normally (e.g. avrdude).
use_pty = false

# Markers that, if seen in the tool's output, cause the process to be
# killed -- for tools that finish their real work but then hang on a
# prompt (e.g. "press enter to exit") instead of exiting on their own.
# Leave empty/omitted for tools that exit on their own.
stop_on = []

[tool_settings.custom_settings]
# CLI Arguments see the AVRDude implementation for more details
default = []

# Optional. A table of named presets of extra $variable values (e.g.
# per-board memory offsets), merged into the substitution variables
# available to the argument lists above -- for tools whose arguments vary
# by target/board in ways a single fixed preset can't express. Selected
# via the app's sub-settings dropdown; passed as flash()'s sub_settings
# argument. Leave empty/omitted if the tool doesn't need this.
[tool_settings.custom_settings.sub_settings]
default = {}

[tool_settings.progress_bar]
# Settings relating to how the progress bar gets updated
method = "none"

num_steps = 50
# This is a list of values that increment the progress bar. It starts with the first item and each time it matches that 
# item in the output terminal, it increments the progress bar and moves to the next item.
# This will wrap around to the beginning once progressing to the 
inc_step_on = [
	"#"
]

regex_method = "normal"

step_read_regex = ""
step_final_regex = ""

# hex regex vars
initial_address = ""
final_address = ""
next_address = ""