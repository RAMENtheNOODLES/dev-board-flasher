name: Promote Changelog

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  promote-changelog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Promote [Unreleased] section
        id: promote
        run: |
          result=$(python scripts/promote_changelog.py)
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: startsWith(steps.promote.outputs.result, 'CHANGED:')
        run: |
          version="${{ steps.promote.outputs.result }}"
          version="${version#CHANGED:}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: update changelog for v$version [skip ci]"
          git push origin HEAD:main
