name: Build and Release

on:
  push:

permissions:
  contents: write
  pull-requests: read
  issues: write

jobs:
  check-pr:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      has_open_pr: ${{ steps.check.outputs.has_open_pr }}
    steps:
      - name: Check for an open pull request on this branch
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh pr list --repo "${{ github.repository }}" --head "${{ github.ref_name }}" --state open --json number --jq 'length')
          if [ "$count" -gt 0 ]; then
            echo "has_open_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_open_pr=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: check-pr
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && needs.check-pr.outputs.has_open_pr != 'true' }}
    uses: ./.github/workflows/tests.yml

  prepare-release:
    needs: [check-pr, test]
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && needs.check-pr.outputs.has_open_pr != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: github.ref_name == 'main'
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.ref_name == 'main'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Strip -devN suffix and promote changelog
        if: github.ref_name == 'main'
        shell: bash
        run: |
          strip_result=$(python scripts/strip_dev_suffix.py)
          promote_result=$(python scripts/promote_changelog.py)
          if [[ "$strip_result" == CHANGED:* || "$promote_result" == CHANGED:* ]]; then
            if [[ "$strip_result" == CHANGED:* ]]; then
              version="${strip_result#CHANGED:}"
            else
              version="${promote_result#CHANGED:}"
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pyproject.toml CHANGELOG.md
            git commit -m "chore: release v$version [skip ci]"
            git push origin HEAD:main
          fi

  # Rebases develop onto main so it picks up the version bump/changelog
  # commit prepare-release may have just pushed, before build reads
  # pyproject.toml and compiles the release from main.
  sync-develop:
    needs: [check-pr, prepare-release]
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && needs.check-pr.outputs.has_open_pr != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: github.ref_name == 'main'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        if: github.ref_name == 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch develop
        if: github.ref_name == 'main'
        run: git fetch origin develop

      - name: Check if develop needs rebasing
        if: github.ref_name == 'main'
        id: check
        run: |
          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase develop onto main
        if: github.ref_name == 'main' && steps.check.outputs.needed == 'true'
        id: rebase
        run: |
          git checkout -B develop origin/develop
          if git rebase origin/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push rebased develop
        if: github.ref_name == 'main' && steps.check.outputs.needed == 'true' && steps.rebase.outputs.conflict == 'false'
        run: git push --force-with-lease origin develop

      - name: Open an issue for the conflict
        if: github.ref_name == 'main' && steps.check.outputs.needed == 'true' && steps.rebase.outputs.conflict == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="develop needs a manual rebase onto main"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --json title --jq "[.[] | select(.title == \"$title\")] | length")
          if [ "$existing" -eq 0 ]; then
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "$title" \
              --body "Auto-rebasing \`develop\` onto \`main\` (triggered by ${{ github.sha }}) hit a conflict and was aborted, so \`develop\` was left unchanged. Please resolve it manually:

          \`\`\`
          git checkout develop
          git rebase main
          # resolve conflicts, then:
          git push --force-with-lease
          \`\`\`"
          fi
          exit 1

  build:
    needs: [check-pr, test, sync-develop]
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && needs.check-pr.outputs.has_open_pr != 'true' }}
    runs-on: [self-hosted, Windows]
    env:
      # Outside github.workspace on purpose: actions/checkout runs `git
      # clean -ffdx` by default, which would wipe an untracked cache dir
      # living inside the checkout between runs. A fixed path on the
      # runner's own disk persists across jobs without needing
      # actions/cache at all.
      NUITKA_CACHE_DIR: C:\ci-cache\nuitka
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # prepare-release may have just pushed a version-bump/changelog
          # commit to main; checking out github.ref_name (the branch tip)
          # rather than the default trigger SHA picks that commit up.
          ref: ${{ github.ref_name }}

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read version from pyproject.toml
        id: version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $tag = "v$version"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Fail if release already exists
        if: github.ref_name == 'main'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.version.outputs.tag }}" *>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Release ${{ steps.version.outputs.tag }} already exists. Bump the version in pyproject.toml before merging to main."
            exit 1
          }
          exit 0

      - name: Install build tools
        shell: pwsh
        run: choco install make innosetup --no-progress -y

      - name: Create virtual environment and install project
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Activate virtual environment
        shell: pwsh
        run: |
          $venvPath = (Resolve-Path ".venv").Path
          echo "$venvPath\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "VIRTUAL_ENV=$venvPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: make compile
        shell: bash
        run: make compile

      - name: Package build output
        shell: pwsh
        run: |
          if (-not (Test-Path "build") -or (Get-ChildItem "build" -Force | Measure-Object).Count -eq 0) {
            throw "build\ is missing or empty after 'make compile' - nothing to package."
          }
          Compress-Archive -Path build\* -DestinationPath "dev-board-flasher-${{ steps.version.outputs.version }}-windows.zip" -ErrorAction Stop

      - name: Build installer
        shell: pwsh
        # Runs after the zip above so the installer exe (also written to
        # build\) doesn't get swept into the portable build's zip.
        run: |
          ISCC "/DAppVersion=${{ steps.version.outputs.version }}" scripts\installer.iss
          Copy-Item "build\upload_wiz_setup.exe" "dev-board-flasher-${{ steps.version.outputs.version }}-setup.exe"

      - name: Extract changelog notes for this version
        if: github.ref_name == 'main'
        shell: bash
        run: python scripts/changelog_notes.py "${{ steps.version.outputs.version }}" release_notes.md

      - name: Create GitHub release
        if: github.ref_name == 'main'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" `
            "dev-board-flasher-${{ steps.version.outputs.version }}-windows.zip" `
            "dev-board-flasher-${{ steps.version.outputs.version }}-setup.exe" `
            --title "${{ steps.version.outputs.tag }}" `
            --notes-file release_notes.md

      - name: Upload build artifact
        if: github.ref_name != 'main'
        uses: actions/upload-artifact@v4
        with:
          name: dev-board-flasher-${{ steps.version.outputs.version }}-windows
          path: |
            dev-board-flasher-${{ steps.version.outputs.version }}-windows.zip
            dev-board-flasher-${{ steps.version.outputs.version }}-setup.exe
          retention-days: 14
