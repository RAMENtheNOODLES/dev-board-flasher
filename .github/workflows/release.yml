name: Build and Release

on:
  push:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: windows-latest
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read version from pyproject.toml
        id: version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $tag = "v$version"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Fail if release already exists
        if: github.ref_name == 'main'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.version.outputs.tag }}" *>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Release ${{ steps.version.outputs.tag }} already exists. Bump the version in pyproject.toml before merging to main."
            exit 1
          }
          exit 0

      - name: Install make
        shell: pwsh
        run: choco install make --no-progress -y

      - name: Create virtual environment and install project
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Activate virtual environment
        shell: pwsh
        run: |
          $venvPath = (Resolve-Path ".venv").Path
          echo "$venvPath\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "VIRTUAL_ENV=$venvPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache Nuitka compilation cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: nuitka-${{ runner.os }}-python${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            nuitka-${{ runner.os }}-python${{ steps.setup-python.outputs.python-version }}-
            nuitka-${{ runner.os }}-

      - name: make compile
        shell: bash
        run: make compile

      - name: Package build output
        shell: pwsh
        run: |
          if (-not (Test-Path "build") -or (Get-ChildItem "build" -Force | Measure-Object).Count -eq 0) {
            throw "build\ is missing or empty after 'make compile' - nothing to package."
          }
          Compress-Archive -Path build\* -DestinationPath "dev-board-flasher-${{ steps.version.outputs.version }}-windows.zip" -ErrorAction Stop

      - name: Create GitHub release
        if: github.ref_name == 'main'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" `
            "dev-board-flasher-${{ steps.version.outputs.version }}-windows.zip" `
            --title "${{ steps.version.outputs.tag }}" `
            --generate-notes

      - name: Upload build artifact
        if: github.ref_name == 'develop'
        uses: actions/upload-artifact@v4
        with:
          name: dev-board-flasher-${{ steps.version.outputs.version }}-windows
          path: dev-board-flasher-${{ steps.version.outputs.version }}-windows.zip
          retention-days: 14
