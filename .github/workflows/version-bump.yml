name: Version Bump

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  bump-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bump version
        id: bump
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            range_log=$(git log -1 --pretty=format:'%B%x1e')
          else
            range_log=$(git log ${{ github.event.before }}..${{ github.event.after }} --pretty=format:'%B%x1e')
          fi
          new_version=$(printf '%s' "$range_log" | python scripts/bump_version.py)
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push origin HEAD:develop
