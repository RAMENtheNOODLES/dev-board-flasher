name: Tests

on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: windows-latest
    env:
      # Headless Qt - CI has no display server for QApplication/widget tests.
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create virtual environment and install project
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Run tests
        shell: pwsh
        run: .venv\Scripts\python.exe -m pytest -q

      - name: Lint (report-only)
        shell: pwsh
        # Not a gate yet: the existing codebase has a large pre-existing
        # violation count under ruff's default rules, so this reports
        # findings without failing the build until that backlog is
        # triaged/fixed. --exit-zero keeps this step green regardless of
        # what it finds, rather than relying on continue-on-error (which
        # would also hide unrelated failures, e.g. ruff itself crashing).
        run: .venv\Scripts\python.exe -m ruff check --exit-zero .
